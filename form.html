<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1 style="text-align: center;">Student Registration Form</h1>
    <img src="https://static.vecteezy.com/system/resources/thumbnails/078/378/467/small/student-id-card-unique-flat-multicolor-icon-vector.jpg" alt="Student ID Logo" class="profile-img" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #1a73e8; display: block; margin: 15px auto;">

    <form action="thanks.html">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required placeholder="Enter your name">

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">

        <button type="submit">Submit</button>
    </form>

</body>
</html>
